[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvic-azure-devops-connector"
version = "1.0.0"
description = "Conector Ruvic para Azure DevOps (work items, pipelines, comentarios)"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31,<3.0",
]

[tool.setuptools.packages.find]
include = ["ruvic_azure_devops_connector*"]
